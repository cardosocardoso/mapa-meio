# Full stack: the web app + the Valhalla routing engine.
#
#   docker compose up -d --build      # open http://<host>:8080
#
# Geocoding (ZIP + city) is baked into the app image from GeoNames — no extra service.
# On first boot Valhalla downloads the US extract (via tile_urls) into ./data/valhalla
# and builds routing tiles there; later runs reuse them. Needs lots of disk (~30-50 GB)
# and ~4-8 GB RAM — comfortable on the Proxmox box.

services:
  app:
    build: .
    container_name: mapa-meio-app
    ports:
      - "8080:3000"
    environment:
      - PORT=3000
      - VALHALLA_URL=http://valhalla:8002
    depends_on:
      - valhalla
    restart: unless-stopped


  valhalla:
    # gis-ops "batteries-included" image: downloads the pbf, builds tiles, then serves.
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: mapa-meio-valhalla
    ports:
      - "8002:8002"
    volumes:
      - ./data/valhalla:/custom_files
    environment:
      # Auto-download the continental-US extract on first run.
      - tile_urls=https://download.geofabrik.de/north-america/us-latest.osm.pbf
      - use_tiles_ignore_pbf=False
      - force_rebuild=False
      - build_elevation=False
      - build_admins=True
      - build_time_zones=False
      - build_tar=True
      - serve_tiles=True
      - server_threads=4
    restart: unless-stopped
